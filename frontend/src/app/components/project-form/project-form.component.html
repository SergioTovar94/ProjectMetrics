<!-- src/app/components/project-form/project-form.component.html -->
<h2 mat-dialog-title>Nuevo Proyecto</h2>

<form [formGroup]="projectForm" (ngSubmit)="onSubmit()">
    <mat-dialog-content>
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nombre del proyecto</mat-label>
            <input matInput formControlName="name" placeholder="Ej: Sistema de Facturación">
            <mat-error *ngIf="projectForm.get('name')?.hasError('required')">
                El nombre es requerido
            </mat-error>
            <mat-error *ngIf="projectForm.get('name')?.hasError('minlength')">
                El nombre debe tener al menos 3 caracteres
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Descripción (opcional)</mat-label>
            <textarea matInput formControlName="description" rows="3"
                placeholder="Breve descripción del proyecto"></textarea>
        </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button mat-button type="button" (click)="onCancel()">Cancelar</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="projectForm.invalid || submitting">
            {{ submitting ? 'Creando...' : 'Crear Proyecto' }}
        </button>
    </mat-dialog-actions>
</form>
